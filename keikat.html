<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keikat – Thö Bulizongs</title>
  <link rel="preload" href="styles.css" as="style" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preload" href="/fontit/playfair-display-latin-900-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fontit/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <script src="nav.js" defer></script>


  <div class="page-header">
    <p>Missä soitamme</p>
    <h1>Keikkakalenteri</h1>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="vaihtoTab('tulevat', this)">Tulevat keikat</button>
    <button class="tab-btn" onclick="vaihtoTab('menneet', this)">Menneet keikat</button>
  </div>

  <!-- TULEVAT -->
  <div class="tab-content active" id="tab-tulevat">
    <section>
      <div class="container">
        <div class="events-list" id="list-tulevat">
          <div class="loading">Ladataan keikkoja...</div>
        </div>
      </div>
    </section>
  </div>

  <!-- MENNEET -->
  <div class="tab-content" id="tab-menneet">
    <section>
      <div class="container">
        <div id="list-menneet">
          <div class="loading">Ladataan keikkoja...</div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Sisältö tulee yhdestä data.json-tiedostosta, jonka Netlify kokoaa
    // julkaisun yhteydessä (scripts/build.py).
    const DATA = '/data.json?v=' + Date.now();

    function parseDate(str) {
      if (!str) return null;
      // Vain päiväosa, jotta aikavyöhyke ei siirrä päivää
      return new Date(str.slice(0, 10) + 'T12:00:00');
    }

    function formatDate(str) {
      if (!str) return '';
      return parseDate(str).toLocaleDateString('fi-FI',
        { day: 'numeric', month: 'long', year: 'numeric' });
    }

    const KUUKAUDET = ['Tammi','Helmi','Maalis','Huhti','Touko','Kesä',
                       'Heinä','Elo','Syys','Loka','Marras','Joulu'];

    function eventItemHTML(k, mennyt = false) {
      const d = parseDate(k.date);
      const day = String(d.getDate()).padStart(2, '0');
      const month = KUUKAUDET[d.getMonth()];
      const year = d.getFullYear();
      const thisYear = new Date().getFullYear();
      return `
        <div class="event-item${mennyt ? ' mennyt' : ''}">
          <div class="event-date">
            <div class="day">${day}</div>
            <div class="month">${month}</div>
            ${mennyt && year !== thisYear ? `<div class="year">${year}</div>` : ''}
          </div>
          <div class="event-info">
            <h3>${k.title || ''} – ${k.city || ''}</h3>
            <p>${k.venue || ''}${k.time ? ' &nbsp;·&nbsp; klo ' + k.time : ''}${k.info ? ' &nbsp;·&nbsp; ' + k.info : ''}</p>
          </div>
          <div class="event-tag">${k.type || ''}</div>
        </div>`;
    }

    function vaihtoTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + tab).classList.add('active');
    }

    async function lataaKeikat() {
      const listTulevat = document.getElementById('list-tulevat');
      const listMenneet = document.getElementById('list-menneet');
      try {
        const res = await fetch(DATA);
        if (!res.ok) throw new Error('data.json ' + res.status);
        const keikat = (await res.json()).keikat || [];

        const today = new Date(); today.setHours(0, 0, 0, 0);

        const tulevat = keikat
          .filter(k => k.date && parseDate(k.date) >= today)
          .sort((a, b) => parseDate(a.date) - parseDate(b.date));

        const menneet = keikat
          .filter(k => k.date && parseDate(k.date) < today)
          .sort((a, b) => parseDate(b.date) - parseDate(a.date));

        listTulevat.innerHTML = tulevat.length
          ? '<div class="events-list">' + tulevat.map(k => eventItemHTML(k, false)).join('') + '</div>'
          : '<div class="empty-state">Ei tulevia keikkoja juuri nyt — <a href="index.html#yhteydenotto">varaa meidät esiintymään täältä</a></div>';

        if (!menneet.length) {
          listMenneet.innerHTML = '<div class="empty-state">Keikkahistoria kertyy ajan myötä.</div>';
        } else {
          const vuosiRyhmat = {};
          menneet.forEach(k => {
            const vuosi = parseDate(k.date).getFullYear();
            (vuosiRyhmat[vuosi] = vuosiRyhmat[vuosi] || []).push(k);
          });
          listMenneet.innerHTML = Object.keys(vuosiRyhmat)
            .sort((a, b) => b - a)
            .map(vuosi => `
              <h2 class="year-heading">${vuosi}</h2>
              <div class="events-list">
                ${vuosiRyhmat[vuosi].map(k => eventItemHTML(k, true)).join('')}
              </div>`)
            .join('');
        }

        document.querySelector('.tab-btn').textContent = `Tulevat keikat (${tulevat.length})`;

      } catch (e) {
        console.error('Keikkojen lataus epäonnistui:', e);
        listTulevat.innerHTML = '<div class="empty-state">Keikkoja ei juuri nyt löydy.</div>';
        listMenneet.innerHTML = '<div class="empty-state">Keikkoja ei juuri nyt löydy.</div>';
      }
    }

    lataaKeikat();
  </script>

  <script src="footer.js" defer></script>
</body>
</html>
