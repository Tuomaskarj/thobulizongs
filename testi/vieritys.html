<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Vieritystesti</title>

<style>
  /* Fontit samat kuin oikealla sivulla, jotta rasterointi vastaa sitä */
  @font-face {
    font-family: 'Playfair Display'; font-style: italic; font-weight: 900;
    font-display: swap;
    src: url('/fontit/playfair-display-latin-900-italic.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Playfair Display'; font-style: normal; font-weight: 900;
    font-display: swap;
    src: url('/fontit/playfair-display-latin-900-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'DM Sans'; font-style: normal; font-weight: 400;
    font-display: swap;
    src: url('/fontit/dm-sans-latin-400-normal.woff2') format('woff2');
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: #fff;
    font-family: 'DM Sans', system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ── Muuttujat joita testataan. Luokka <html>-elementissä kytkee päälle. ── */

  /* 1. Leikkauskonteksti bodylle */
  html.v-clip body { overflow-x: clip; }

  /* 2. Tahmea navigaatio */
  .navi { display: none; }
  html.v-navi .navi {
    display: flex;
    position: sticky; top: 0; z-index: 10;
    background: #000;
    padding: 1rem 1.2rem;
    align-items: center; justify-content: space-between;
    border-bottom: 1px solid #222;
  }

  /* 3. Verkkofontit vai järjestelmäfontti */
  html.v-fontit h2 { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 900; }
  html.v-fontit body { font-family: 'DM Sans', system-ui, sans-serif; }
  html:not(.v-fontit) h2 { font-family: system-ui, sans-serif; font-weight: 700; font-style: normal; }
  html:not(.v-fontit) body { font-family: system-ui, sans-serif; }

  /* 4. Sumennetut varjot */
  html.v-varjot h2 { text-shadow: 3px 3px 0 #000, 5px 5px 0 rgba(0,0,0,.4), 8px 8px 20px rgba(0,0,0,.6); }

  /* 5. Kuvat */
  .kuva { display: none; }
  html.v-kuvat .kuva { display: block; }

  /* ── Ohjauspaneeli ── */
  .ohjaus {
    padding: 1rem 1.2rem 1.4rem;
    background: #141414;
    border-bottom: 1px solid #333;
  }
  .ohjaus h1 { font-size: 1.1rem; margin-bottom: .2rem; }
  .ohjaus .vinkki { font-size: .82rem; color: #b0b0b0; line-height: 1.5; margin-bottom: .9rem; }
  .kytkimet { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .kytkin {
    display: flex; align-items: center; gap: .5rem;
    background: #000; border: 1px solid #444; border-radius: 6px;
    padding: .6rem .7rem; font-size: .82rem; cursor: pointer;
    min-height: 44px;
  }
  .kytkin input { width: 18px; height: 18px; accent-color: #fff; flex: none; }
  .napit { display: flex; gap: .5rem; margin-top: .6rem; flex-wrap: wrap; }
  .nappi {
    background: #fff; color: #000; border: none; border-radius: 6px;
    padding: .65rem 1rem; font-size: .82rem; font-family: inherit;
    min-height: 44px; cursor: pointer;
  }
  .nappi.toissijainen { background: #000; color: #fff; border: 1px solid #555; }

  /* ── Tulosruutu. EI position:fixed, koska kiinteä elementti on itse
       yksi testattavista muuttujista eikä saa vaikuttaa mittaukseen. ── */
  #tulos {
    position: absolute; left: 12px; right: 12px;
    background: #fff; color: #000;
    border-radius: 10px; padding: 1rem 1.1rem;
    font-size: .9rem; line-height: 1.55;
    display: none; z-index: 50;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  #tulos b { font-size: 1.45rem; display: block; margin-bottom: .1rem; }
  #tulos .rivi { display: flex; justify-content: space-between; gap: 1rem; padding: .18rem 0; }
  #tulos .rivi span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  #tulos .selite { margin-top: .6rem; font-size: .78rem; color: #555; line-height: 1.45; }

  /* ── Sisältö ── */
  section { padding: 2.2rem 1.2rem; border-bottom: 1px solid #1c1c1c; }
  h2 { font-size: 1.9rem; line-height: 1.15; margin-bottom: .7rem; }
  p { color: #c8c8c8; line-height: 1.75; margin-bottom: .8rem; font-size: .95rem; }
  .kortti { background: #111; border-radius: 8px; overflow: hidden; margin-top: 1rem; }
  .kuva { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #222; }
  .kortti .teksti { padding: .9rem 1rem; }
  .kortti h3 { font-size: 1rem; margin-bottom: .2rem; }
  .kortti p { font-size: .85rem; margin: 0; }
</style>
</head>
<body>

<nav class="navi"><strong>Thö Bulizongs</strong><span>☰</span></nav>

<div class="ohjaus">
  <h1>Vieritystesti</h1>
  <p class="vinkki">
    Vieritä sivua sormella alas ja ylös. Kun pysähdyt, ruudulle ilmestyy mittaustulos.
    Kytke sitten yksi asia kerrallaan pois ja vieritä uudelleen — se joka korjaa
    luvun, on syy.
  </p>
  <div class="kytkimet">
    <label class="kytkin"><input type="checkbox" data-v="clip" /> body overflow-x</label>
    <label class="kytkin"><input type="checkbox" data-v="navi" /> tahmea navi</label>
    <label class="kytkin"><input type="checkbox" data-v="fontit" /> verkkofontit</label>
    <label class="kytkin"><input type="checkbox" data-v="varjot" /> sumeat varjot</label>
    <label class="kytkin"><input type="checkbox" data-v="kuvat" /> kuvat</label>
    <label class="kytkin"><input type="checkbox" data-v="pitka" /> pitkä sivu</label>
  </div>
  <div class="napit">
    <button class="nappi" id="kaikki">Kaikki päälle</button>
    <button class="nappi toissijainen" id="eiMitaan">Kaikki pois</button>
  </div>
</div>

<main id="sisalto"></main>

<div id="tulos" role="status" aria-live="polite"></div>

<script>
// ─────────────────────────────────────────────────────────
//  Sisällön rakentaminen
// ─────────────────────────────────────────────────────────
const TEKSTI = [
  'Thö Bulizongs on kuusihenkinen harrastebändi, jonka sydämessä sykkii aito rakkaus musiikkiin ja elämänmakuiseen menoon.',
  'Soitamme tuttuja kappaleita ja hyviä tulkintoja vuosikymmenten varrelta, sellaisia jotka saavat juhlaväen liikkeelle.',
  'Seinäjokelainen autotallibändi perustettiin rakkaudesta musiikkiin ja soittamiseen.'
];

function rakenna(lohkoja) {
  const m = document.getElementById('sisalto');
  let html = '';
  for (let i = 1; i <= lohkoja; i++) {
    html += '<section><h2>Osio ' + i + '</h2>' +
      TEKSTI.map(t => '<p>' + t + '</p>').join('') +
      '<div class="kortti">' +
        '<img class="kuva" alt="" loading="lazy" decoding="async" ' +
             'src="https://i.ytimg.com/vi/bbLuRnk7qyE/hqdefault.jpg" />' +
        '<div class="teksti"><h3>Kortti ' + i + '</h3><p>Kuvateksti</p></div>' +
      '</div></section>';
  }
  m.innerHTML = html;
}

// ─────────────────────────────────────────────────────────
//  Mittaus: kuinka tiheästi selain ehtii piirtää vierityksen aikana
// ─────────────────────────────────────────────────────────
let valit = [];          // ruutujen väliset ajat
let alkuValit = [];      // eleen ensimmäiset 200 ms erikseen
let vierittaa = false;
let eleAlkoi = 0;
let viimeY = window.scrollY;
let edellinen = performance.now();
let pysaytin = null;

function ruutu(nyt) {
  const vali = nyt - edellinen;
  edellinen = nyt;
  if (vierittaa) {
    valit.push(vali);
    if (nyt - eleAlkoi < 200) alkuValit.push(vali);
  }
  requestAnimationFrame(ruutu);
}
requestAnimationFrame(ruutu);

window.addEventListener('scroll', () => {
  const y = window.scrollY;
  if (Math.abs(y - viimeY) < 1) return;
  viimeY = y;
  if (!vierittaa) {
    vierittaa = true;
    eleAlkoi = performance.now();
    valit = [];
    alkuValit = [];
    piilota();
  }
  clearTimeout(pysaytin);
  pysaytin = setTimeout(loppui, 350);
}, { passive: true });

function mediaani(a) {
  if (!a.length) return 0;
  const s = [...a].sort((x, y) => x - y);
  return s[Math.floor(s.length / 2)];
}

function loppui() {
  vierittaa = false;
  if (valit.length < 5) return;

  const fpsAlku  = alkuValit.length ? 1000 / mediaani(alkuValit) : 0;
  const fpsKaikki = 1000 / mediaani(valit);
  const pahin = Math.max(...valit);
  const hitaita = valit.filter(v => v > 20).length;
  const osuus = Math.round(100 * hitaita / valit.length);

  const hyva = fpsAlku >= 45 && osuus <= 15;
  const arvio = hyva ? 'Sujuva' : (fpsAlku < 30 ? 'Nykii selvästi' : 'Hieman nykii');

  nayta(
    '<b>' + arvio + '</b>' +
    rivi('Eleen alku (ensimmäiset 200 ms)', Math.round(fpsAlku) + ' fps') +
    rivi('Koko ele', Math.round(fpsKaikki) + ' fps') +
    rivi('Hitain ruutu', Math.round(pahin) + ' ms') +
    rivi('Ruutuja yli 20 ms', osuus + ' %') +
    '<div class="selite">Eleen alku on tärkein luku — siinä nykiminen tuntuu. ' +
    'Yli 45 fps on sujuva, alle 30 nykii selvästi. ' +
    'Kytke yksi asia pois ja vieritä uudelleen.</div>'
  );
}

function rivi(nimi, arvo) {
  return '<div class="rivi"><span>' + nimi + '</span><span>' + arvo + '</span></div>';
}

const tulosEl = document.getElementById('tulos');
function nayta(html) {
  tulosEl.innerHTML = html;
  tulosEl.style.display = 'block';
  // Absoluuttinen sijainti nykyisen näkymän kohdalle — ei position:fixed,
  // koska kiinteä elementti on yksi testattavista muuttujista.
  tulosEl.style.top = (window.scrollY + 16) + 'px';
}
function piilota() { tulosEl.style.display = 'none'; }

// ─────────────────────────────────────────────────────────
//  Kytkimet
// ─────────────────────────────────────────────────────────
const kytkimet = [...document.querySelectorAll('[data-v]')];

function kaytaTila() {
  kytkimet.forEach(k => {
    if (k.dataset.v === 'pitka') return;
    document.documentElement.classList.toggle('v-' + k.dataset.v, k.checked);
  });
  const pitka = kytkimet.find(k => k.dataset.v === 'pitka').checked;
  rakenna(pitka ? 10 : 3);   // 10 lohkoa ≈ oikean etusivun korkeus (~6300px)
  piilota();
  tallenna();
}

function tallenna() {
  try {
    localStorage.setItem('vieritystesti',
      JSON.stringify(kytkimet.map(k => k.checked)));
  } catch (e) {}
}

function lataa() {
  let tila = null;
  try { tila = JSON.parse(localStorage.getItem('vieritystesti')); } catch (e) {}
  if (Array.isArray(tila) && tila.length === kytkimet.length) {
    kytkimet.forEach((k, i) => k.checked = tila[i]);
  } else {
    kytkimet.forEach(k => k.checked = true);   // oletus: kaikki päällä
  }
}

kytkimet.forEach(k => k.addEventListener('change', kaytaTila));
document.getElementById('kaikki').addEventListener('click', () => {
  kytkimet.forEach(k => k.checked = true); kaytaTila();
});
document.getElementById('eiMitaan').addEventListener('click', () => {
  kytkimet.forEach(k => k.checked = false); kaytaTila();
});

lataa();
kaytaTila();
</script>
</body>
</html>
