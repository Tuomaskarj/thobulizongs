[build]
  publish = "."
  # Kokoaa CMS-sisällön data.json- ja feed.xml-tiedostoiksi joka julkaisussa
  command = "python3 scripts/build.py"

# Hallintapaneeli on kansiossa takaovi/, joten se palvellaan sellaisenaan
# ilman uudelleenohjausta — myös takaovi/config.yml.
#
# Estetään /admin, jota botit kokeilevat ensimmäisenä.
[[redirects]]
  from = "/admin"
  to = "/"
  status = 302

[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 302
