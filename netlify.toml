[build]
  publish = "."
  # Kokoaa CMS-sisällön data.json- ja feed.xml-tiedostoiksi joka julkaisussa
  command = "python3 scripts/build.py"

# Hallintapaneeli on kansiossa takaovi/, joten se palvellaan sellaisenaan
# ilman uudelleenohjausta — myös takaovi/config.yml.
#
# Estetään /admin, jota botit kokeilevat ensimmäisenä.
[[redirects]]
  from = "/admin"
  to = "/"
  status = 302

[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 302

# Fontit eivät muutu, joten selain saa pitää ne vuoden.
# Jos jokin fontti joskus vaihtuu, anna tiedostolle uusi nimi.
[[headers]]
  for = "/fontit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# data.json kootaan joka julkaisussa — se ei saa jäädä välimuistiin
[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Testisivu ei kuulu hakukoneisiin
[[headers]]
  for = "/testi/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
