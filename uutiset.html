<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uutiset – Thö Bulizongs</title>
  <link rel="preload" href="styles.css" as="style" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preload" href="/fontit/playfair-display-latin-900-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fontit/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <script src="nav.js" defer></script>


  <div class="page-header">
    <p>Ajankohtaista</p>
    <h1>Uutiset</h1>
  </div>

  <main>
    <div class="uutiset-lista" id="uutiset-lista">
      <div class="loading">Ladataan uutisia...</div>
    </div>
  </main>

  <script>
    // Sisältö tulee yhdestä data.json-tiedostosta, jonka Netlify kokoaa
    // julkaisun yhteydessä (scripts/build.py).
    const DATA = '/data.json?v=' + Date.now();

    function parseDate(str) {
      if (!str) return null;
      // Vain päiväosa, jotta aikavyöhyke ei siirrä päivää
      return new Date(str.slice(0, 10) + 'T12:00:00');
    }

    function formatDate(str) {
      if (!str) return '';
      return parseDate(str).toLocaleDateString('fi-FI',
        { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }

    // Kevyt markdown → HTML
    function markdownToHtml(md) {
      if (!md) return '';
      return escapeHtml(md)
        .replace(/\\\s*$/gm, '')
        .replace(/^## (.*)$/gm, '<h3>$1</h3>')
        .replace(/^# (.*)$/gm, '<h3>$1</h3>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .split(/\n\s*\n/)
        .filter(p => p.trim())
        .map(p => p.startsWith('<h') ? p : `<p>${p.replace(/\n/g, ' ')}</p>`)
        .join('\n');
    }

    async function lataaUutiset() {
      const lista = document.getElementById('uutiset-lista');
      try {
        const res = await fetch(DATA);
        if (!res.ok) throw new Error('data.json ' + res.status);
        const uutiset = (await res.json()).uutiset || [];

        if (!uutiset.length) {
          lista.innerHTML = '<div class="loading">Uutisia ei vielä ole.</div>';
          return;
        }

        lista.innerHTML = uutiset.map(u => `
          <article class="uutinen-full" id="${escapeHtml(u.slug)}">
            ${u.image ? `<div class="uutinen-full-kuva"><img src="${escapeHtml(u.image)}" alt="${escapeHtml(u.title || '')}" loading="lazy" decoding="async" /></div>` : ''}
            <div class="uutinen-full-body">
              <div class="uutinen-pvm">${formatDate(u.date)}</div>
              <h2 class="uutinen-otsikko">${escapeHtml(u.title || 'Uutinen')}</h2>
              <div class="uutinen-teksti">${markdownToHtml(u.body)}</div>
            </div>
          </article>`).join('');

        // Jos osoitteessa on ankkuri, siirry siihen vasta kun sisältö on paikallaan
        if (window.location.hash) {
          const el = document.querySelector(window.location.hash);
          if (el) requestAnimationFrame(() => el.scrollIntoView({ behavior: 'smooth' }));
        }

      } catch (e) {
        console.error('Uutisten lataus epäonnistui:', e);
        lista.innerHTML = '<div class="loading">Uutisia ei juuri nyt löydy — palataan pian!</div>';
      }
    }

    lataaUutiset();
  </script>

  <script src="footer.js" defer></script>
</body>
</html>
