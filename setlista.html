<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settilista – Thö Bulizongs</title>
  <link rel="preload" href="styles.css" as="style" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preload" href="/fontit/playfair-display-latin-900-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fontit/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <script src="nav.js" defer></script>


  <div class="page-header">
    <p>Mitä soitamme</p>
    <h1>Settilista</h1>
    <p class="sub" id="setlista-maara">Häihin, juhliin ja pubeihin</p>
  </div>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-tab active" onclick="filterGenre('kaikki', this)">Kaikki</button>
    <button class="filter-tab" onclick="filterGenre('Suomalainen iskelmä', this)">Iskelmä</button>
    <button class="filter-tab" onclick="filterGenre('Rock & Pop', this)">Rock & Pop</button>
    <button class="filter-tab" onclick="filterGenre('Tanssi & Viihde', this)">Tanssi & Viihde</button>
    <button class="filter-tab" onclick="filterGenre('Kansainväliset', this)">Kansainväliset</button>
  </div>

  <main id="main-content">
    <div class="loading">Ladataan settilistaa...</div>
  </main>

  <script>
    // Sisältö tulee yhdestä data.json-tiedostosta, jonka Netlify kokoaa
    // julkaisun yhteydessä (scripts/build.py).
    const DATA = '/data.json?v=' + Date.now();

    function parseDate(str) {
      if (!str) return null;
      // Vain päiväosa, jotta aikavyöhyke ei siirrä päivää
      return new Date(str.slice(0, 10) + 'T12:00:00');
    }

    function formatDate(str) {
      if (!str) return '';
      return parseDate(str).toLocaleDateString('fi-FI',
        { day: 'numeric', month: 'long', year: 'numeric' });
    }

    let kaikki = [];
    let aktiivinenGenre = 'kaikki';

    const GENRE_SLUG = {
      'Suomalainen iskelmä': 'iskelma',
      'Rock & Pop': 'rock',
      'Tanssi & Viihde': 'tanssi',
      'Kansainväliset': 'kansainvalinen'
    };

    function renderLista(kappaleet) {
      const main = document.getElementById('main-content');

      // Kappalemäärä otsikkoon — ei kovakoodattuna, vaan todellisesta listasta
      const maara = document.getElementById('setlista-maara');
      if (maara) {
        maara.textContent = kappaleet.length
          ? `${kappaleet.length} kappaletta · Häihin, juhliin ja pubeihin`
          : 'Häihin, juhliin ja pubeihin';
      }

      const ensimmainenSuodatin = document.querySelector('.filter-tab');
      if (ensimmainenSuodatin) ensimmainenSuodatin.textContent = `Kaikki (${kappaleet.length})`;

      const suodatettu = aktiivinenGenre === 'kaikki'
        ? kappaleet
        : kappaleet.filter(k => k.genre === aktiivinenGenre);

      const genret = [...new Set(suodatettu.map(k => k.genre))].filter(Boolean);

      if (genret.length === 0) {
        main.innerHTML = '<div class="loading">Ei kappaleita.</div>';
        return;
      }

      main.innerHTML = genret.map(genre => {
        const kappaleetGenressa = suodatettu.filter(k => k.genre === genre);
        return `
          <div class="genre-section" data-genre="${GENRE_SLUG[genre] || genre}">
            <div class="genre-header">
              <span class="genre-title">${genre}</span>
              <span class="genre-count">${kappaleetGenressa.length} kappaletta</span>
            </div>
            <div class="song-list">
              ${kappaleetGenressa.map((k, i) => `
                <div class="song-row">
                  <div class="song-num">${i + 1}</div>
                  <div class="song-info">
                    <div class="title">${k.title || ''}</div>
                    <div class="artist">${k.artist || ''}</div>
                  </div>
                  <div class="song-year">${k.year || ''}</div>
                </div>`).join('')}
            </div>
          </div>`;
      }).join('');
    }

    function filterGenre(genre, btn) {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      aktiivinenGenre = genre;
      renderLista(kaikki);
    }

    async function lataaSettilista() {
      const main = document.getElementById('main-content');
      try {
        const res = await fetch(DATA);
        if (!res.ok) throw new Error('data.json ' + res.status);
        kaikki = (await res.json()).settilista || [];
        kaikki.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'fi'));
        renderLista(kaikki);
      } catch (e) {
        console.error('Settilistan lataus epäonnistui:', e);
        main.innerHTML = '<div class="loading">Settilistaa ei juuri nyt löydy.</div>';
      }
    }

    lataaSettilista();
  </script>
  <script src="footer.js" defer></script>
</body>
</html>
